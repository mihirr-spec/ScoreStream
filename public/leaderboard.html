<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Leaderboard - ScoreStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme (light/dark) before the page is drawn.
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>
  <header class="nav">
    <div class="container-wide nav-inner">
      <a class="logo" href="index.html">
        <img class="logo-img" src="img/logo.webp" alt="" width="34" height="34">
        ScoreStream
      </a>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch between light and dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn btn-primary btn-sm" href="login.html">Log in <span aria-hidden="true">&rarr;</span></a>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="container">

      <!-- Shown when no ?event= is in the URL -->
      <section id="event-picker" class="hidden">
        <div class="page-head">
          <div>
            <h1>Live leaderboards</h1>
            <div class="sub">Pick an event to follow. Rankings update the moment a judge submits.</div>
          </div>
        </div>
        <div class="event-cards" id="event-list"></div>
      </section>

      <!-- One event's leaderboard -->
      <section id="board" class="hidden">
        <div class="page-head">
          <div>
            <h1 id="event-name"></h1>
            <div class="sub"><span id="event-status"></span><span id="updated" class="muted"></span></div>
          </div>
          <span class="bw-live" id="connection"><span class="pulse off" id="conn-dot"></span> <span id="conn-text">Connecting...</span></span>
        </div>

        <div class="podium" id="podium"></div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Rank</th><th>Team</th><th>Average</th><th></th><th>Judges</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="empty" class="empty hidden">No scores yet. The table fills in as judges submit.</div>
        </div>
      </section>

      <section id="feedback-section" class="hidden" style="margin-top:30px">
        <div class="page-head"><div><h1 style="font-size:1.6rem">Team feedback</h1><div class="sub">Written by AI from the judges' comments</div></div></div>
        <div class="team-grid" id="feedback-list"></div>
      </section>
    </div>
  </main>

  <script src="js/common.js?v=18"></script>
  <script src="js/leaderboard.js?v=18"></script>
</body>
</html>
