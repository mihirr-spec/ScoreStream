<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Leaderboard - ScoreStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">
          <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b74e6"/><stop offset="1" stop-color="#1f4fbf"/></linearGradient></defs><path d="M23.5 8.5c-1.8-1.9-4.6-3-7.6-3-4.3 0-7.4 2.3-7.4 5.5 0 6.6 15 4.7 15 10.6 0 3.2-3.2 5.4-7.5 5.4-3.1 0-6-1.2-8-3.3" fill="none" stroke="url(#logo-grad)" stroke-width="4.6" stroke-linecap="round"/></svg>
        </span>
        ScoreStream
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm hide-sm" href="leaderboard.html">All events</a>
        <a class="btn btn-primary btn-sm" href="login.html">Log in</a>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="container">

      <!-- Shown when no ?event= is in the URL -->
      <section id="event-picker" class="hidden">
        <div class="page-head">
          <div>
            <h1>Live leaderboards</h1>
            <div class="sub">Pick an event to follow. Rankings update the moment a judge submits.</div>
          </div>
        </div>
        <div class="event-cards" id="event-list"></div>
      </section>

      <!-- One event's leaderboard -->
      <section id="board" class="hidden">
        <div class="page-head">
          <div>
            <h1 id="event-name"></h1>
            <div class="sub"><span id="event-status"></span><span id="updated" class="muted"></span></div>
          </div>
          <span class="bw-live" id="connection"><span class="pulse off" id="conn-dot"></span> <span id="conn-text">Connecting...</span></span>
        </div>

        <div class="podium" id="podium"></div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Rank</th><th>Team</th><th>Average</th><th></th><th>Judges</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="empty" class="empty hidden">No scores yet. The table fills in as judges submit.</div>
        </div>
      </section>

      <section id="feedback-section" class="hidden" style="margin-top:30px">
        <div class="page-head"><div><h1 style="font-size:1.6rem">Team feedback</h1><div class="sub">Written by AI from the judges' comments</div></div></div>
        <div class="team-grid" id="feedback-list"></div>
      </section>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
