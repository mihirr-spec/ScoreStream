<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Leaderboard - ScoreStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <header class="nav">
    <div class="container-wide nav-inner">
      <a class="logo" href="index.html">
        <img class="logo-img" src="img/logo.webp" alt="" width="34" height="34">
        ScoreStream
      </a>
      <div class="nav-actions">
        <div class="search-wrap">
          <button class="icon-btn" id="search-btn" type="button" aria-label="Search events" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          <div class="search-pop hidden" id="search-pop">
            <input id="search-input" type="search" placeholder="Search events..." autocomplete="off" aria-label="Search events">
            <div id="search-results"></div>
          </div>
        </div>
        <a class="btn btn-ghost btn-sm hide-sm" href="leaderboard.html">Live leaderboard</a>
        <a class="btn btn-primary btn-sm" href="login.html">Log in <span aria-hidden="true">&rarr;</span></a>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="container">

      <!-- Shown when no ?event= is in the URL -->
      <section id="event-picker" class="hidden">
        <div class="page-head">
          <div>
            <h1>Live leaderboards</h1>
            <div class="sub">Pick an event to follow. Rankings update the moment a judge submits.</div>
          </div>
        </div>
        <div class="event-cards" id="event-list"></div>
      </section>

      <!-- One event's leaderboard -->
      <section id="board" class="hidden">
        <div class="page-head">
          <div>
            <h1 id="event-name"></h1>
            <div class="sub"><span id="event-status"></span><span id="updated" class="muted"></span></div>
          </div>
          <span class="bw-live" id="connection"><span class="pulse off" id="conn-dot"></span> <span id="conn-text">Connecting...</span></span>
        </div>

        <div class="podium" id="podium"></div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Rank</th><th>Team</th><th>Average</th><th></th><th>Judges</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="empty" class="empty hidden">No scores yet. The table fills in as judges submit.</div>
        </div>
      </section>

      <section id="feedback-section" class="hidden" style="margin-top:30px">
        <div class="page-head"><div><h1 style="font-size:1.6rem">Team feedback</h1><div class="sub">Written by AI from the judges' comments</div></div></div>
        <div class="team-grid" id="feedback-list"></div>
      </section>
    </div>
  </main>

  <script src="js/common.js?v=5"></script>
  <script src="js/leaderboard.js?v=5"></script>
</body>
</html>
