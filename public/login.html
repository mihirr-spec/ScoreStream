<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - ScoreStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme (light/dark) before the page is drawn.
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <main class="login2">
    <div class="corner-toggle"><button class="icon-btn theme-toggle" type="button" aria-label="Switch between light and dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button></div>
    <!-- Campus photos on both sides (decorative) -->
    <div class="login2-side left"><img src="img/login-left.webp" alt=""></div>
    <div class="login2-side right"><img src="img/login-right.webp" alt=""></div>

    <a class="logo login2-logo" href="index.html">
      <img class="logo-img" src="img/logo.webp" alt="" width="34" height="34">
      ScoreStream
    </a>

    <div class="login2-card">
      <h1 id="login-title">Welcome <span>back</span></h1>
      <p class="sub" id="login-sub">Sign in to manage your events, scores and teams.</p>

      <!-- Role tabs. "Student" logs in with their team's code. -->
      <div class="login2-tabs" role="tablist">
        <button class="login2-tab" data-role="team" type="button" role="tab">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-6.8 9.7V16c0 2.2 3 4 6.8 4s6.8-1.8 6.8-4v-3.3L12 16.4l-6.8-3.7z"/></svg>
          <span>Student</span>
        </button>
        <button class="login2-tab" data-role="judge" type="button" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M15.5 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .8 3.2 2.6 3.5 5.2"/></svg>
          <span>Judge</span>
        </button>
        <button class="login2-tab" data-role="admin" type="button" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Administrator</span>
        </button>
      </div>

      <form class="login2-form" id="login-form">
        <!-- Shown for Administrator (username) and Judge (their name) -->
        <div id="username-block" class="hidden">
          <label class="lbl" for="username" id="username-label">Admin username</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"/></svg>
            <input id="username" autocomplete="username" placeholder="Enter your username">
          </div>
        </div>
        <label class="lbl" for="secret" id="secret-label">Team access code</label>
        <div class="input-icon">
          <!-- key icon (codes) / lock icon (password) - swapped by login.js -->
          <svg id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M14.5 8.5l2 2"/></svg>
          <svg id="icon-lock" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="secret" required autocomplete="off">
          <button class="eye-btn hidden" id="eye-btn" type="button" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <!-- Only shown when an organiser creates a new account -->
        <div id="confirm-block" class="hidden">
          <label class="lbl" for="confirm">Confirm password</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="confirm" type="password" autocomplete="new-password" placeholder="Type the password again">
          </div>
        </div>

        <div class="login2-row">
          <label><input type="checkbox" id="remember"> Remember me</label>
          <button class="link-btn" id="forgot-btn" type="button">Forgot your code?</button>
        </div>
        <p class="forgot-text hidden" id="forgot-text"></p>

        <button class="btn btn-primary signin-btn" id="login-btn" type="submit">Sign In <span aria-hidden="true">→</span></button>
      </form>

      <div class="login2-or">OR</div>

      <button class="demo-wide" id="demo-btn" type="button">
        <span aria-hidden="true">⭐</span> <span id="demo-label">Try the demo Student account</span>
      </button>

      <p class="login2-foot hidden" id="register-foot"><span id="register-q">New organiser?</span> <button class="link-btn" id="register-toggle" type="button">Create an account</button></p>
      <p class="login2-foot">New to ScoreStream? <a href="index.html#roles">See how it works</a></p>
    </div>
  </main>

  <script src="js/common.js?v=12"></script>
  <script src="js/login.js?v=12"></script>
</body>
</html>
