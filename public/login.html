<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - ScoreStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>
        </span>
        ScoreStream
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="leaderboard.html">Live leaderboard</a>
      </div>
    </div>
  </header>

  <div class="login-wrap">
    <!-- Left: photo + message that change with the selected role -->
    <aside class="login-side">
      <img id="side-img" src="img/admin.jpg" alt="">
      <div class="login-quote">
        <h2 id="side-title">Run the whole event</h2>
        <p id="side-text">Create events, add teams and judges, and watch every score arrive in real time.</p>
      </div>
    </aside>

    <!-- Right: the login card -->
    <main class="login-main">
      <div class="login-card">
        <h1>Welcome back</h1>
        <p class="muted">Choose how you are taking part, then log in.</p>

        <div class="role-tabs" role="tablist">
          <button class="role-tab" data-role="admin" type="button" role="tab">Admin</button>
          <button class="role-tab" data-role="judge" type="button" role="tab">Judge</button>
          <button class="role-tab" data-role="team" type="button" role="tab">Team</button>
        </div>

        <form id="login-form">
          <div class="field">
            <label for="secret" id="secret-label">Admin password</label>
            <input id="secret" type="password" required autocomplete="off">
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="login-btn" type="submit">Log in</button>
        </form>

        <div class="login-hint" id="login-hint"></div>

        <div class="divider">or explore without an account</div>
        <button class="btn btn-ghost btn-block btn-lg demo-btn" id="demo-btn" type="button">Try the demo</button>
        <p class="muted small" id="demo-text" style="margin:10px 0 0;text-align:center"></p>
      </div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
